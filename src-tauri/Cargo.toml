[package]
name = "timetree"
version = "0.2.0"
description = "树状时间笔记 TimeTree —— 节点全局、日期视图"
authors = ["TimeTree"]
edition = "2021"
rust-version = "1.77.2"

# Tauri 2 需要一个 lib 目标（移动端复用），桌面端由 main.rs 调用
[lib]
name = "timetree_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SQLite：bundled 会静态编译 SQLite，用户机器无需预装 sqlite3
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
parking_lot = "0.12"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# 注意：`custom-protocol` 决定 Tauri 是「生产模式（内嵌前端产物）」还是「开发模式（连 devUrl）」。
# 生产构建必须带上它，否则窗口会去连 http://localhost:1420 并报 Connection refused：
#   cargo build --release --features custom-protocol
# 走 `pnpm tauri build` / `scripts/package-desktop.sh` 时会自动带上。
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
